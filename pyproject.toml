[project]
name = "cmms-mcp-server"
version = "0.1.0"
description = "An MCP server that exposes a (fictional) CMMS - assets, alarms and work orders - to AI assistants, with role checks, a work-order state machine and a read-only mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
cmms-mcp-server = "cmms_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmms_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # tool descriptions and schemas are long single lines
